<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>contact</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <nav class="site-nav" aria-label="Main navigation">
        <a href="index.html">artem bronnikov</a>
        <a href="projects.html">projects</a>
        <a href="research.html">research</a>
        <a href="contact.html" aria-current="page">contact</a>
    </nav>

    <main>
        <form class="contact-form" action="#" method="post">
            <input class="contact-cell" type="text" id="name" name="name" placeholder="name" aria-label="Name" autocomplete="name" required>
            <input class="contact-cell" type="email" id="email" name="email" placeholder="email" aria-label="Email" autocomplete="email" required>
            <textarea class="contact-cell contact-cell--message" id="message" name="message" placeholder="message" aria-label="Message" required></textarea>
            <button class="contact-cell contact-cell--send" type="submit">send</button>
        </form>
    </main>
</body>
</html>
