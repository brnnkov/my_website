    <!-- Visual contact form; add a form service endpoint before launch. -->
    <main class="contact-page">
        <form class="contact-form" action="#" method="post">
            <div class="contact-fields">
                <input class="contact-cell" type="text" id="subject" name="subject" placeholder="subject" aria-label="Subject" required>
                <input class="contact-cell" type="email" id="email" name="email" placeholder="email" aria-label="Email" autocomplete="email" required>
                <textarea class="contact-cell contact-cell--message" id="message" name="message" placeholder="message" aria-label="Message" required></textarea>
                <button class="contact-cell contact-cell--send" type="submit">send</button>
            </div>
        </form>
    </main>
